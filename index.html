<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ORBITAL DEFENSE</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070d0b">

<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#070d0b;color:#b7f5d0;font-family:ui-monospace,Menlo,Consolas,monospace;touch-action:manipulation;user-select:none}
#app,#menu{max-width:480px;margin:0 auto;height:100%;box-sizing:border-box}
#app{display:none;flex-direction:column}
#menu{display:flex;flex-direction:column;gap:8px;padding:12px;overflow-y:auto}
h1{margin:6px 0;text-align:center;letter-spacing:4px;color:#4ade80;font-size:22px}
.card{background:#0e1c17;border:1px solid #234a3a;border-radius:8px;padding:10px;font-size:13px}
.card small{color:#7fb89a;display:block;margin:3px 0 6px}
.bar{height:8px;background:#12241d;border-radius:4px;margin:6px 0}.bar i{display:block;height:100%;background:#4ade80;border-radius:4px}
#hud{display:flex;justify-content:space-between;padding:8px 10px;font-size:14px;border-bottom:1px solid #1f3a30}
#hud b{color:#4ade80}
canvas{width:100%;display:block;background:#0b1210}
#panel{padding:8px;display:flex;flex-direction:column;gap:6px}
#info{font-size:12px;color:#7fb89a;min-height:30px}
.row{display:flex;gap:6px}
button{flex:1;background:#10231c;color:#b7f5d0;border:1px solid #2d5c48;border-radius:6px;padding:10px 4px;font:inherit;font-size:12px}
button:disabled{opacity:.35}
button.go{background:#166534;border-color:#4ade80;color:#fff;font-weight:bold}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000d;text-align:center;flex-direction:column;gap:14px;font-size:20px}
#msg .row{width:80%}#ad{position:fixed;inset:0;z-index:9;display:none;background:#000;color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:12px}#ac{font-size:48px}#btns{flex-wrap:wrap}#btns button{flex:1 1 22%}
</style></head><body>
<div id="menu"></div><div id="ad"><div>📺 PUBLICITÉ (démo)</div><div id="ac"></div><small>Récompense dans quelques secondes…</small></div>
<div id="app">
<div id="hud"><span>❤ <b id="hp"></b></span><span>⛁ <b id="cr"></b></span><span>VAGUE <b id="wv"></b>/<span id="wm"></span></span></div>
<canvas id="c"></canvas>
<div id="panel"><div id="info"></div><div class="row" id="btns"></div>
<div class="row"><button class="go" id="go">▶ VAGUE</button><button id="st">☄</button><button id="sp" style="flex:.4">x1</button><button id="adb" style="flex:1.2">📺</button><button id="qt" style="flex:.4">✕</button></div></div>
</div>
<div id="msg"><div id="mt"></div><div class="row" id="mx"></div><div class="row"><button id="rs">REJOUER</button><button id="mn">MENU</button></div></div>
<script>
const $=id=>document.getElementById(id),C=8,R=11,cv=$('c'),cx=cv.getContext('2d');
/* ---------- Sauvegarde & progression ---------- */
let S={xp:0,perks:{dmg:0,cash:0,hp:0,rng:0,inc:0,strike:0},stars:[0,0,0,0,0,0],elite:false,best:0,muted:false};
try{const s=JSON.parse(localStorage.getItem('od2'));if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem('od2',JSON.stringify(S))}catch(e){}};
const level=()=>1+Math.floor(Math.sqrt(S.xp/40)),P=()=>S.perks;
const points=()=>level()-1-Object.values(S.perks).reduce((a,b)=>a+b,0);
const PK={dmg:['Munitions perforantes','+8% dégâts / niv.'],cash:['Logistique','+25 crédits de départ / niv.'],hp:['Blindage de base','+3 PV de base / niv.'],
 rng:['Optique tactique','+5% portée / niv.'],inc:['Butin de guerre','+8% crédits par kill / niv.'],strike:['Frappe orbitale','Débloque ☄ : dégâts sur tous les ennemis']};
const SP=[[-1,10],[6,10],[6,8],[1,8],[1,6],[6,6],[6,4],[1,4],[1,2],[6,2],[6,0]];
const MS=[{n:'Secteur Alpha',w:10,d:1,p:[[-1,1],[6,1],[6,4],[1,4],[1,7],[6,7],[6,10]]},
 {n:'Vallée Bravo',w:12,d:1.25,p:[[-1,1],[1,1],[1,9],[3,9],[3,3],[5,3],[5,9],[7,9]]},
 {n:'Forteresse Charlie',w:15,d:1.5,p:SP},
 {n:'Nexus Delta',w:18,d:1.8,p:[[-1,0],[6,0],[6,2],[1,2],[1,4],[6,4],[6,6],[1,6],[1,8],[6,8],[6,10],[3,10]]},
 {n:'Citadelle Écho',w:20,d:2.1,p:[[-1,10],[7,10],[7,0],[0,0],[0,8],[5,8],[5,2],[2,2],[2,6],[4,6]]},
 {n:'Assaut infini',w:999,d:1.6,p:SP}];
function menu(v){
 $('menu').style.display='flex';$('app').style.display='none';$('msg').style.display='none';
 const lv=level(),a=40*(lv-1)**2,b=40*lv*lv,sp=points();
 let h='<h1>ORBITAL DEFENSE</h1><div class=card>🎖 COMMANDANT niv. <b>'+lv+'</b><div class=bar><i style="width:'+Math.round((S.xp-a)/(b-a)*100)+'%"></i></div>XP '+S.xp+'/'+b+' · Points de talent : <b>'+sp+'</b></div>';
 if(v=='skills'){for(const k in PK)h+='<div class=card><b>'+PK[k][0]+'</b> ('+S.perks[k]+'/5)<small>'+PK[k][1]+'</small><button onclick="perk(\''+k+'\')" '+(sp<1||S.perks[k]>=5?'disabled':'')+'>Améliorer (1 pt)</button></div>';
  h+='<button onclick="menu()">← Retour</button>'}
 else{h+='<div class=card>⚠ Mode Élite : ennemis +80% PV, XP ×2.5<br><button onclick="S.elite=!S.elite;save();menu()">'+(S.elite?'ÉLITE : ACTIVÉ ✔':'Élite : désactivé')+'</button></div>';
 MS.forEach((m,i)=>{const ok=i==0||(S.stars[i-1]||0)>0,s=S.stars[i]||0;h+='<div class=card><b>Mission '+(i+1)+' — '+m.n+'</b><small>'+(m.w>900?'Vagues infinies · record : vague '+(S.best||0):m.w+' vagues · '+'★'.repeat(s)+'☆'.repeat(3-s))+'</small><button onclick="play('+i+')" '+(ok?'':'disabled')+'>'+(ok?'DÉPLOYER':'🔒 Termine la mission '+i)+'</button></div>'});
 h+='<div class=row><button onclick="menu(\'skills\')">🎖 Talents'+(sp>0?' ('+sp+')':'')+'</button><button onclick="S.muted=!S.muted;save();menu()">'+(S.muted?'🔇 Son off':'🔊 Son on')+'</button></div>'}
 $('menu').innerHTML=h}
function perk(k){if(points()>0&&S.perks[k]<5){S.perks[k]++;save();snd('build');menu('skills')}}
/* ---------- Son (WebAudio procédural) ---------- */
let AC,step=0;
function tone(f,d,ty,v,f2,t0){if(!AC||S.muted)return;const t=AC.currentTime+(t0||0),o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,v){if(!AC||S.muted)return;const n=AC.sampleRate*d,bf=AC.createBuffer(1,n,AC.sampleRate),a=bf.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=v;s.buffer=bf;s.connect(g).connect(AC.destination);s.start()}
function snd(k){({gun:()=>tone(700,.06,'square',.03,200),rail:()=>{tone(220,.35,'sawtooth',.08,35);noise(.2,.08)},emp:()=>tone(900,.18,'sine',.06,250),
 boom:()=>noise(.22,.09),build:()=>{tone(330,.08,'square',.05);tone(495,.1,'square',.05,0,.08)},alarm:()=>tone(130,.3,'sawtooth',.1,80),
 wave:()=>{tone(220,.2,'sawtooth',.07);tone(330,.3,'sawtooth',.07,0,.2)},strike:()=>{noise(.9,.2);tone(90,.9,'sawtooth',.15,30)},win:()=>[392,494,587,784].forEach((f,i)=>tone(f,.25,'square',.06,0,i*.15)),lose:()=>tone(200,1,'sawtooth',.1,40),missile:()=>{tone(150,.25,'sawtooth',.07,60);noise(.15,.06)},laser:()=>tone(1400,.05,'sine',.025,900),arc:()=>{noise(.08,.06);tone(300,.08,'square',.03,1200)},mortar:()=>{tone(80,.4,'sine',.15,30);noise(.15,.07)},radar:()=>0})[k]()}
setInterval(()=>{if(!AC||S.muted||$('app').style.display!='flex')return;step++;const bass=[55,55,65.4,49][(step>>3)&3];if(step%2==0)tone(bass,.3,'triangle',.06);if(step%4==3)tone(bass*4*(step%8<4?1.5:1.2),.12,'square',.012)},230);
addEventListener('pointerdown',()=>{if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(AC&&AC.state=='suspended')AC.resume()});
/* ---------- Combat ---------- */
let adsUsed=0,revived=false,cs,M,seg,tot,pc,hp,cr,wave,towers,enemies,queue,fx,sel,spawnT,running,speed=1,over,kills,sk,lastSk='';
function setPath(){seg=[];tot=0;pc=new Set();const W=MS[M].p;for(let i=0;i<W.length-1;i++){const a=W[i],b=W[i+1],l=Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1]);seg.push({a,b,l,s:tot});tot+=l;for(let k=0;k<=l;k++)pc.add((a[0]+Math.sign(b[0]-a[0])*k)+','+(a[1]+Math.sign(b[1]-a[1])*k))}}
function pos(d){for(const s of seg)if(d<=s.s+s.l){const t=(d-s.s)/s.l;return[s.a[0]+(s.b[0]-s.a[0])*t,s.a[1]+(s.b[1]-s.a[1])*t]}return MS[M].p.at(-1)}
const TT={gun:{n:'Mitrailleuse',s:'Mitr.',cost:50,range:2.2,dmg:8,rate:.25,col:'#4ade80',req:1},
 emp:{n:'Émetteur EMP (ralentit)',s:'EMP',cost:90,range:2,dmg:3,rate:.5,col:'#c084fc',req:2,slow:1},
 missile:{n:'Lance-missiles (zone)',s:'Missile',cost:110,range:3,dmg:28,rate:1.2,col:'#fb923c',req:3,spl:1},
 rail:{n:'Railgun',s:'Rail',cost:120,range:3.6,dmg:70,rate:1.7,col:'#60a5fa',req:4},
 arc:{n:'Bobine Tesla (chaîne x3)',s:'Tesla',cost:130,range:2.4,dmg:16,rate:.8,col:'#22d3ee',req:5,chain:3},
 laser:{n:'Laser (ignore blindage)',s:'Laser',cost:150,range:2.8,dmg:5,rate:.08,col:'#f472b6',req:6,pierce:1},
 mortar:{n:'Mortier plasma (zone)',s:'Mortier',cost:170,range:5,dmg:70,rate:2.4,col:'#facc15',req:7,spl:1.4},
 radar:{n:'Radar (+dégâts voisins)',s:'Radar',cost:100,range:1.6,dmg:0,rate:9,col:'#e2e8f0',req:8,buff:1}};
const ET={drone:{hp:30,sp:1.7,r:8,rew:6,col:'#fbbf24'},swarm:{hp:12,sp:2.5,r:5,rew:3,col:'#fde047'},mech:{hp:90,sp:1,r:10,rew:10,col:'#fb923c'},
 armor:{hp:160,sp:.9,r:11,rew:14,col:'#94a3b8',arm:6},medic:{hp:110,sp:1.1,r:9,rew:14,col:'#34d399'},tank:{hp:260,sp:.65,r:13,rew:22,col:'#f87171',arm:3},
 spectre:{hp:130,sp:1.9,r:9,rew:20,col:'#a78bfa'},titan:{hp:1200,sp:.4,r:20,rew:150,col:'#ef4444',arm:8}};
function play(i){M=i;$('menu').style.display='none';$('app').style.display='flex';cs=Math.floor(Math.min(innerWidth,480)/C);cv.width=C*cs;cv.height=R*cs;setPath();reset()}
function reset(){adsUsed=0;revived=false;hp=20+3*P().hp;cr=150+25*P().cash;wave=0;towers=[];enemies=[];queue=[];fx=[];sel=null;spawnT=0;running=false;over=false;kills=0;sk=10;$('msg').style.display='none';$('wm').textContent=MS[M].w>900?'∞':MS[M].w;ui()}
function startWave(){if(running||over)return;wave++;running=true;snd('wave');const n=5+wave*2,m=(1+.2*wave)*MS[M].d*(S.elite?1.8:1),pool=['drone'];
 [['swarm',2],['mech',3],['armor',4],['medic',5],['tank',6],['spectre',8]].forEach(a=>{if(wave>=a[1])pool.push(a[0])});queue=[];
 for(let i=0;i<n;i++){const t=pool[(i*5+wave)%pool.length];queue.push({t,m});if(t=='swarm')queue.push({t,m},{t,m})}
 if(wave%5==0)queue.push({t:'titan',m});spawnT=0;ui()}
const buff=t=>towers.reduce((a,r)=>a+(TT[r.type].buff&&Math.hypot(r.x-t.x,r.y-t.y)<=1.5?.2+.1*(r.lv-1):0),0);
const stat=(t,k)=>{const b=TT[t.type];return k=='dmg'?b.dmg*1.6**(t.lv-1)*(1+.08*P().dmg)*(1+buff(t)):k=='range'?(b.range+(t.lv-1)*.25)*(1+.05*P().rng):b.rate*.88**(t.lv-1)};
function add(l,f,d){const e=document.createElement('button');e.textContent=l;e.disabled=!!d;e.onclick=f;$('btns').appendChild(e)}
function ui(){$('hp').textContent=hp;$('cr').textContent=cr;$('wv').textContent=wave;$('go').disabled=running||over;$('adb').textContent='📺 +200⛁ ('+(2-adsUsed)+')';$('adb').disabled=adsUsed>=2;$('sp').textContent='x'+speed;$('st').style.display=P().strike?'':'none';
 const b=$('btns');b.innerHTML='';const inf=$('info'),lv=level();
 if(sel&&sel.tower){const t=sel.tower,up=Math.round(TT[t.type].cost*.7*t.lv),sell=Math.round(t.spent*.6);inf.textContent=TT[t.type].n+' niv.'+t.lv+' — dégâts '+stat(t,'dmg').toFixed(0)+' · portée '+stat(t,'range').toFixed(1);
  if(t.lv<3)add('⬆ Améliorer '+up,()=>{if(cr>=up){cr-=up;t.spent+=up;t.lv++;snd('build');ui()}},cr<up);add('Vendre +'+sell,()=>{cr+=sell;towers=towers.filter(x=>x!==t);sel=null;ui()})}
 else if(sel){inf.textContent='Installer une tourelle :';for(const k in TT){const T=TT[k],lk=lv<T.req;add(lk?'🔒 niv.'+T.req:T.s+' '+T.cost,()=>{if(cr>=T.cost){cr-=T.cost;const t={type:k,x:sel.x,y:sel.y,lv:1,cd:0,ang:0,spent:T.cost};towers.push(t);sel={x:t.x,y:t.y,tower:t};snd('build');ui()}},lk||cr<T.cost)}}
 else inf.textContent='Touche une case libre pour construire.'}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*C),y=Math.floor((e.clientY-r.top)/r.height*R);
 sel=pc.has(x+','+y)?null:{x,y,tower:towers.find(t=>t.x==x&&t.y==y)};ui()});
$('go').onclick=startWave;$('sp').onclick=()=>{speed=speed==1?2:1;ui()};$('rs').onclick=()=>reset();$('mn').onclick=()=>menu();$('qt').onclick=()=>{over=true;menu()};
$('st').onclick=()=>{if(sk>0||over)return;sk=40;snd('strike');const d=40+30*P().strike;for(const e of enemies){const p=pos(e.d);fx.push({x1:p[0]+.5,y1:p[1]+.5,c:'#fff',l:.4,circ:1});e.hp-=d;if(e.hp<=0)kill(e)}};
function kill(e){if(e.dead)return;e.dead=1;cr+=Math.round(ET[e.t].rew*(1+.08*P().inc));kills++;snd('boom');const p=pos(e.d);fx.push({x1:p[0]+.5,y1:p[1]+.5,c:ET[e.t].col,l:.3,circ:1});ui()}
function showAd(cb){/* DÉMO : à remplacer par un appel AdMob (rewarded) dans la version Android empaquetée */const a=$('ad');a.style.display='flex';let n=3;$('ac').textContent=n;const iv=setInterval(()=>{n--;$('ac').textContent=n;if(n<=0){clearInterval(iv);a.style.display='none';cb()}},1000)}
$('adb').onclick=()=>{if(over||adsUsed>=2)return;showAd(()=>{adsUsed++;cr+=200;ui()})};
function end(w){over=true;const l0=level(),el=S.elite?2.5:1,inf=MS[M].w>900;let g=Math.round((kills+wave*(inf?10:5)+(w?50*(M+1):0))*el),st=0;
 if(w){st=hp>=15?3:hp>=8?2:1;const o=S.stars[M]||0;g+=Math.max(0,st-o)*100;S.stars[M]=Math.max(o,st)}
 if(inf)S.best=Math.max(S.best||0,wave);S.xp+=g;save();snd(w?'win':'lose');
 $('mt').innerHTML=(w?'MISSION ACCOMPLIE ✔<br>'+'★'.repeat(st)+'☆'.repeat(3-st):inf?'ASSAUT TERMINÉ<br>Vague '+wave:'BASE DÉTRUITE ✖')+'<br><small>+'+g+' XP'+(level()>l0?' · NIVEAU '+level()+' ! 🎖 +1 point de talent':'')+'</small>';
 const mx=$('mx');mx.innerHTML='';const ab=(l,fn)=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{b.disabled=true;showAd(fn)};mx.appendChild(b)};
 if(w)ab('📺 XP ×2 (+'+g+')',()=>{S.xp+=g;save();$('mt').innerHTML+='<br><small>XP doublé ✔</small>'});
 else if(!revived)ab('📺 Continuer (+10 PV)',()=>{revived=true;S.xp-=g;hp=10;over=false;save();$('msg').style.display='none';ui()});
 $('msg').style.display='flex'}
function update(dt){sk-=dt;
 if(queue.length){spawnT-=dt;if(spawnT<=0){const q=queue.shift(),b=ET[q.t];enemies.push({t:q.t,d:0,hp:b.hp*q.m,max:b.hp*q.m,slow:0});spawnT=Math.max(.3,1.1-wave*.04)}}
 for(const e of enemies){e.slow=Math.max(0,e.slow-dt);e.d+=ET[e.t].sp*(e.slow>0?.5:1)*dt;
  if(e.t=='medic')for(const o of enemies)if(o!==e&&Math.abs(o.d-e.d)<1.5)o.hp=Math.min(o.max,o.hp+12*dt);
  if(e.d>=tot){e.dead=1;hp-=e.t=='titan'?5:1;snd('alarm');ui()}}
 for(const t of towers){t.cd-=dt;const T=TT[t.type];if(T.buff){t.ang+=dt*2;continue}let best=null;const rg=stat(t,'range');
  for(const e of enemies){if(e.dead)continue;const p=pos(e.d);if(Math.hypot(p[0]-t.x,p[1]-t.y)<=rg&&(!best||e.d>best.d))best=e}
  if(!best)continue;const p=pos(best.d);t.ang=Math.atan2(p[1]-t.y,p[0]-t.x);if(t.cd>0)continue;
  t.cd=stat(t,'rate');const dm=stat(t,'dmg');t.n=(t.n||0)+1;if(!T.pierce||t.n%4==0)snd(t.type);
  const hit=(e,d)=>{e.hp-=T.pierce?d:Math.max(d*.25,d-(ET[e.t].arm||0));if(e.hp<=0)kill(e)};
  hit(best,dm);if(T.slow&&best.t!='spectre')best.slow=1.2;
  if(T.spl){fx.push({x1:p[0]+.5,y1:p[1]+.5,c:T.col,l:.25,circ:1});for(const e of enemies){if(e!==best&&!e.dead){const q=pos(e.d);if(Math.hypot(q[0]-p[0],q[1]-p[1])<=T.spl)hit(e,dm)}}}
  fx.push({x1:t.x+.5,y1:t.y+.5,x2:p[0]+.5,y2:p[1]+.5,c:T.col,l:.12,w:t.type=='rail'?3:1.5});
  if(T.chain){let cur=p,used=[best];for(let k=1;k<T.chain;k++){let nx=null,nd=1.6;for(const e of enemies){if(e.dead||used.includes(e))continue;const q=pos(e.d),dd=Math.hypot(q[0]-cur[0],q[1]-cur[1]);if(dd<nd){nd=dd;nx=e}}
   if(!nx)break;const q=pos(nx.d);fx.push({x1:cur[0]+.5,y1:cur[1]+.5,x2:q[0]+.5,y2:q[1]+.5,c:T.col,l:.12,w:1.5});hit(nx,dm*.8);used.push(nx);cur=q}}}
 enemies=enemies.filter(e=>!e.dead);fx.forEach(f=>f.l-=dt);fx=fx.filter(f=>f.l>0);
 if(hp<=0)return end(false);
 if(running&&!queue.length&&!enemies.length){running=false;cr+=20+wave*3;if(wave>=MS[M].w)return end(true);ui()}}
function poly(n,r,a0){cx.beginPath();for(let i=0;i<n;i++){const a=a0+i*Math.PI*2/n;cx[i?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r)}cx.closePath()}
function drawTower(t){const X=(t.x+.5)*cs,Y=(t.y+.5)*cs,c=TT[t.type].col,u=cs/50;cx.save();cx.translate(X,Y);
 cx.fillStyle='#0f1f19';poly(6,cs*.42,0);cx.fill();cx.strokeStyle=c;cx.lineWidth=2;cx.stroke();
 cx.rotate(t.ang);cx.fillStyle=c;cx.shadowColor=c;cx.shadowBlur=6;
 switch(t.type){
 case'gun':cx.fillRect(2,-6*u,cs*.42,4*u);cx.fillRect(2,2*u,cs*.42,4*u);cx.fillRect(-6*u,-8*u,10*u,16*u);break;
 case'rail':cx.fillRect(-4*u,-3*u,cs*.6,6*u);cx.fillRect(-2*u,-9*u,14*u,4*u);cx.fillRect(-2*u,5*u,14*u,4*u);break;
